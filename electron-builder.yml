appId: com.bdo.assistant
productName: BDO Assistant
directories:
  output: dist-installer
  buildResources: ui/build
files:
  - dist/**/*
  - dist-ui/**/*
  - dist-renderer/**/*
  - package.json
  - node_modules/**/*
  - "!**/*.map"
  - "!node_modules/electron/**/*"
  - "!node_modules/electron-builder/**/*"
  - "!node_modules/sharp/**/*"
  - "!node_modules/@img/**/*"
  - "!node_modules/typescript/**/*"
  - "!node_modules/tsx/**/*"
extraResources:
  # NOTA: NO incluimos `data/` aquí. El instalador no envía el índice scrapeado
  # (datos derivados de contenido con copyright de garmoth.com y Pearl Abyss).
  # El usuario genera su propio índice en el primer scrape. Ver GOVERNANCE.md.
  - from: ui/build/wallpaper.jpg
    to: wallpaper.jpg
    filter:
      - "**/*"
asar: true
asarUnpack:
  - "**/playwright/**"
  - "**/playwright-core/**"
win:
  target: nsis
  icon: ui/build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: BDO Assistant
